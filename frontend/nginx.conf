server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/xml application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Clean URL rewrites for admin, login, and detail
    location = /admin {
        rewrite ^ /admin.html break;
    }

    location = /login {
        rewrite ^ /admin.html break;
    }

    location = /v1/admin {
        rewrite ^ /admin.html break;
    }

    location = /v1/login {
        rewrite ^ /admin.html break;
    }

    location = /detail {
        rewrite ^ /detail.html break;
    }

    # Reverse proxy ke Backend Go API
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse proxy cadangan untuk endpoint /v1/kajian
    location /v1/kajian {
        proxy_pass http://backend:8080/v1/kajian;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static files & fallback
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Cache media assets
    location ~* \.(?:jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Untuk JS dan CSS, gunakan no-store agar Cloudflare CDN & browser tidak menyimpan cache usang
    location ~* \.(?:css|js)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    }

    error_page 404 /index.html;
}
